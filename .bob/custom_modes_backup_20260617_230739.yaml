      MANDATORY MCP TOOLS: - jCodemunch: search_ast, get_layer_violations, get_dependency_cycles - Sequential Thinking: sequentialthinking (validate compliance) - Graphify: For codebase structure visualization and relationship mapping
      Required Output: docs/brain/EPIC-{ID}/03-audit-report.md
