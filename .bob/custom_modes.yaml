      PHASE 1 - ARCHITECT start_subtask(mode="ptt-architect")
        Read: spec file, RULES_CATALOG.md, prevBacklog (if exists -- READ ONLY)
        Write: docs/brain/{epic}/02-architecture-plan.md
        MANDATORY: architect MUST run LANE-SPLIT GATE before structuring the plan.
          Q1. Same method or within 50 lines? YES -> single pipeline. STOP.
          Q2. Fix B design depends on Fix A final design? YES -> single pipeline. STOP.
          Q3. Each fix has standalone value if the other is blocked? NO -> single pipeline. STOP.
          Q4. Each fix has an independent SIM verification path? NO -> single pipeline. STOP.
          Default: single pipeline. LANES require NO on Q1+Q2 AND YES on Q3+Q4.
          Gate result MUST appear in plan: "LANE-SPLIT GATE RESULT: [SINGLE-PIPELINE|LANES-APPROVED]"
        Full protocol: docs/protocol/PTT_PIPELINE_LANE_SPLIT_PROTOCOL.md
        Return: PLAN_COMPLETE | PLAN_FAILED

