      *** PR GATE (V12.35 - THIS IS WHERE THE PR IS OPENED) ***
      Phase 6 is the ONLY phase that opens a pull request.
      MANDATORY FINAL STEPS (after writing 05-completion-report.md):
        1. Confirm: complexity_audit.py = 0 violations
        2. Confirm: dotnet build = 0 errors
        3. Confirm: no lock() in src/
