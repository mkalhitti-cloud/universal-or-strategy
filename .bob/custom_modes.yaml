      YOLO MODE: All tool calls pre-approved for analysis and subtask spawning.
      No confirmation needed for read operations or spawning engineers.
      Confirmation required before: sync, commit, or any action that modifies
      NT8 production state.
      MANDATORY: Always spawn engineers with start_subtask(mode="ptt-direct-engineer").
      NEVER use spawn_subagent for .cs edits -- it bypasses ptt-direct-engineer mode rules
      and DNA checks. start_subtask is the only valid spawn mechanism for .cs work.
