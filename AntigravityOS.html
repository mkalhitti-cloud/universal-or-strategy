<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Antigravity OS Business Model</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; }
        canvas { display: block; }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            pointer-events: none;
            text-shadow: 0 0 10px rgba(0, 242, 255, 0.5);
            z-index: 10;
        }
        h1 { margin: 0 0 5px 0; font-size: 24px; letter-spacing: 2px; }
        p { margin: 0; font-size: 14px; opacity: 0.8; }
    </style>
</head>
<body>
    <div id="ui">
        <h1>ANTIGRAVITY OS</h1>
        <p>Business Model Visualization</p>
    </div>

    <!-- Import maps polyfill -->
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // Secure random generator to satisfy SonarCloud
        const getRandom = () => {
            const array = new Uint32Array(1);
            window.crypto.getRandomValues(array);
            return array[0] / (0xffffffff + 1);
        };

        const getRandFloatSpread = (range) => {
            return range * (0.5 - getRandom());
        };

        // --- Scene Setup ---
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050510, 0.002);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
        camera.position.set(0, 30, 100);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio);
        renderer.toneMapping = THREE.ReinhardToneMapping;
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 200;

        // --- Post-Processing (Bloom) ---
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.5, 0.4, 0.85);
        bloomPass.threshold = 0.2;
        bloomPass.strength = 1.2;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // --- Environment (Starry Cosmos) ---
        const starsGeometry = new THREE.BufferGeometry();
        const starsMaterial = new THREE.PointsMaterial({ color: 0xffffff, size: 0.5, transparent: true, opacity: 0.8, sizeAttenuation: true });
        const starsVertices = [];
        for (let i = 0; i < 5000; i++) {
            const x = getRandFloatSpread(500);
            const y = getRandFloatSpread(500);
            const z = getRandFloatSpread(500);
            starsVertices.push(x, y, z);
        }
        starsGeometry.setAttribute('position', new THREE.Float32BufferAttribute(starsVertices, 3));
        const starField = new THREE.Points(starsGeometry, starsMaterial);
        scene.add(starField);

        // Gradient Background
        const canvas = document.createElement('canvas');
        canvas.width = 2;
        canvas.height = 2;
        const context = canvas.getContext('2d');
        const gradient = context.createLinearGradient(0, 0, 0, 2);
        gradient.addColorStop(0, '#02000a');
        gradient.addColorStop(1, '#0a0520');
        context.fillStyle = gradient;
        context.fillRect(0, 0, 2, 2);
        const bgTexture = new THREE.CanvasTexture(canvas);
        scene.background = bgTexture;

        // --- Shared Materials ---
        const glassMaterial = new THREE.MeshPhysicalMaterial({
            color: 0xffffff,
            metalness: 0.1,
            roughness: 0.1,
            transmission: 0.9,
            thickness: 0.5,
            ior: 1.5,
            transparent: true,
            opacity: 1
        });

        const coreMaterial = new THREE.MeshStandardMaterial({
            color: 0xbc13fe,
            emissive: 0xbc13fe,
            emissiveIntensity: 2,
            metalness: 0.8,
            roughness: 0.2,
            wireframe: true
        });

        // --- Structures ---

        // 1. Central Distillation Kernel
        const coreGeo = new THREE.IcosahedronGeometry(5, 2);
        const core = new THREE.Mesh(coreGeo, coreMaterial);
        scene.add(core);

        const coreInnerGeo = new THREE.OctahedronGeometry(3, 0);
        const coreInnerMat = new THREE.MeshStandardMaterial({ color: 0xffffff, emissive: 0xffffff, emissiveIntensity: 1 });
        const coreInner = new THREE.Mesh(coreInnerGeo, coreInnerMat);
        core.add(coreInner);

        const coreLight = new THREE.PointLight(0xbc13fe, 100, 50);
        core.add(coreLight);

        // 2. Intelligence Aggregation (Upper Sphere)
        const upperGroup = new THREE.Group();
        upperGroup.position.set(0, 25, 0);
        scene.add(upperGroup);

        const computeNodes = [];
        const computeGeo = new THREE.TetrahedronGeometry(1.5, 0);
        const computeMat = new THREE.MeshStandardMaterial({
            color: 0xbc13fe,
            emissive: 0xbc13fe,
            emissiveIntensity: 0.5,
            metalness: 0.9,
            roughness: 0.1
        });

        for(let i = 0; i < 5; i++) {
            const node = new THREE.Mesh(computeGeo, computeMat);
            const angle = (i / 5) * Math.PI * 2;
            const radius = 15;
            node.position.set(Math.cos(angle) * radius, 0, Math.sin(angle) * radius);
            upperGroup.add(node);
            computeNodes.push({ mesh: node, angle: angle, radius: radius });
        }

        // 3. Infrastructure Revenue (Left Cluster)
        const leftCluster = new THREE.Group();
        leftCluster.position.set(-25, 0, 0);
        scene.add(leftCluster);

        const infraGeo = new THREE.BoxGeometry(4, 4, 4);
        const infraMat = new THREE.MeshPhysicalMaterial({
            color: 0xff8c00,
            emissive: 0xff8c00,
            emissiveIntensity: 0.2,
            metalness: 0.5,
            roughness: 0.1,
            transmission: 0.8,
            thickness: 1
        });

        for(let i=0; i<3; i++) {
            const block = new THREE.Mesh(infraGeo, infraMat);
            block.position.set(
                (getRandom() - 0.5) * 8,
                (getRandom() - 0.5) * 8,
                (getRandom() - 0.5) * 8
            );
            block.rotation.set(getRandom() * Math.PI, getRandom() * Math.PI, 0);
            leftCluster.add(block);
        }
        const infraLight = new THREE.PointLight(0xff8c00, 50, 30);
        leftCluster.add(infraLight);

        // 4. Alpha Dividends (Right Cluster - Droids)
        const rightCluster = new THREE.Group();
        rightCluster.position.set(25, 0, 0);
        scene.add(rightCluster);

        const droids = [];
        const droidGeo = new THREE.OctahedronGeometry(0.8, 0);
        const droidMat = new THREE.MeshStandardMaterial({
            color: 0x00f2ff,
            emissive: 0x00f2ff,
            emissiveIntensity: 0.8,
            metalness: 1,
            roughness: 0
        });

        for(let i=0; i<15; i++) {
            const droid = new THREE.Mesh(droidGeo, droidMat);
            droid.position.set(
                (getRandom() - 0.5) * 15,
                (getRandom() - 0.5) * 15,
                (getRandom() - 0.5) * 15
            );
            rightCluster.add(droid);
            droids.push({
                mesh: droid,
                seed: getRandom() * 100,
                basePos: droid.position.clone()
            });
        }
        const alphaLight = new THREE.PointLight(0x00f2ff, 50, 30);
        rightCluster.add(alphaLight);

        // 5. Network Revenue Pool (Lower Base)
        const poolGeo = new THREE.CylinderGeometry(20, 15, 2, 32);
        const poolMat = new THREE.MeshPhysicalMaterial({
            color: 0x000000,
            metalness: 1,
            roughness: 0,
            clearcoat: 1,
            clearcoatRoughness: 0.1
        });
        const pool = new THREE.Mesh(poolGeo, poolMat);
        pool.position.set(0, -25, 0);
        scene.add(pool);

        const poolInnerGeo = new THREE.CylinderGeometry(18, 18, 2.1, 32);
        const poolInnerMat = new THREE.MeshStandardMaterial({
            color: 0x00f2ff,
            emissive: 0x00f2ff,
            emissiveIntensity: 0.5,
            transparent: true,
            opacity: 0.8
        });
        const poolInner = new THREE.Mesh(poolInnerGeo, poolInnerMat);
        pool.add(poolInner);

        const poolLight = new THREE.PointLight(0x00f2ff, 100, 60);
        poolLight.position.set(0, 5, 0);
        pool.add(poolLight);

        // --- Data Flows (Light Trails) ---
        const flows = [];

        function createFlowLine(startPoint, endPoint, colorHex, controlPoints = []) {
            const points = [startPoint, ...controlPoints, endPoint];
            const curve = new THREE.CatmullRomCurve3(points);

            const pointsGeo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(50));
            const lineMat = new THREE.LineBasicMaterial({
                color: colorHex,
                transparent: true,
                opacity: 0.3
            });
            const line = new THREE.Line(pointsGeo, lineMat);
            scene.add(line);

            // Particle for data packet
            const particleGeo = new THREE.SphereGeometry(0.5, 8, 8);
            const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const particle = new THREE.Mesh(particleGeo, particleMat);

            const flowLight = new THREE.PointLight(colorHex, 10, 10);
            particle.add(flowLight);

            scene.add(particle);

            flows.push({ curve, particle, progress: getRandom(), speed: 0.002 + getRandom() * 0.003 });
        }

        // Upper to Core
        for(let node of computeNodes) {
            const start = new THREE.Vector3().copy(node.mesh.position).add(upperGroup.position);
            createFlowLine(start, core.position, 0xbc13fe);
        }

        // Core to Left & Right Clusters
        createFlowLine(core.position, leftCluster.position, 0xff8c00, [new THREE.Vector3(-10, 5, 5)]);
        createFlowLine(core.position, rightCluster.position, 0x00f2ff, [new THREE.Vector3(10, 5, -5)]);

        // Clusters to Pool
        createFlowLine(leftCluster.position, pool.position, 0xff8c00, [new THREE.Vector3(-15, -10, 0)]);
        createFlowLine(rightCluster.position, pool.position, 0x00f2ff, [new THREE.Vector3(15, -10, 0)]);

        // Re-Investment Loop (Pool to Upper)
        const spiralPoints = [];
        for(let i=0; i<=20; i++) {
            const t = i / 20;
            const angle = t * Math.PI * 4; // 2 loops
            const radius = 20 - (t * 10);
            const y = pool.position.y + t * (upperGroup.position.y - pool.position.y);
            spiralPoints.push(new THREE.Vector3(Math.cos(angle)*radius, y, Math.sin(angle)*radius));
        }
        const spiralCurve = new THREE.CatmullRomCurve3(spiralPoints);

        const spiralGeo = new THREE.TubeGeometry(spiralCurve, 64, 0.5, 8, false);
        const spiralMat = new THREE.MeshStandardMaterial({
            color: 0x00f2ff,
            emissive: 0x00f2ff,
            emissiveIntensity: 1,
            transparent: true,
            opacity: 0.6,
            wireframe: true
        });
        const spiralMesh = new THREE.Mesh(spiralGeo, spiralMat);
        scene.add(spiralMesh);

        // Multiple packets on spiral
        for(let i=0; i<3; i++) {
            const particleGeo = new THREE.SphereGeometry(1, 16, 16);
            const particleMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const particle = new THREE.Mesh(particleGeo, particleMat);
            const light = new THREE.PointLight(0x00f2ff, 20, 15);
            particle.add(light);
            scene.add(particle);
            flows.push({ curve: spiralCurve, particle, progress: i/3, speed: 0.005 });
        }


        // --- General Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.2);
        scene.add(ambientLight);

        // --- Animation Loop ---
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);

            const time = clock.getElapsedTime();

            controls.update();

            // Core pulsing
            const scale = 1 + Math.sin(time * 2) * 0.1;
            core.scale.set(scale, scale, scale);
            core.rotation.y += 0.01;
            core.rotation.x += 0.005;
            coreInner.rotation.y -= 0.02;

            // Upper sphere orbiting
            upperGroup.rotation.y += 0.005;
            for(const node of computeNodes) {
                node.mesh.rotation.x += 0.02;
                node.mesh.rotation.y += 0.02;
            }

            // Left cluster
            leftCluster.rotation.y += 0.002;
            leftCluster.rotation.z = Math.sin(time * 0.5) * 0.1;

            // Right cluster (Droids noise movement)
            rightCluster.rotation.y -= 0.003;
            for(let droid of droids) {
                droid.mesh.position.x = droid.basePos.x + Math.sin(time + droid.seed) * 2;
                droid.mesh.position.y = droid.basePos.y + Math.cos(time * 1.3 + droid.seed) * 2;
                droid.mesh.position.z = droid.basePos.z + Math.sin(time * 0.8 + droid.seed) * 2;
                droid.mesh.rotation.x += 0.05;
                droid.mesh.rotation.y += 0.05;
            }

            // Pool
            poolInner.rotation.y += 0.005;

            // Flows
            for(let flow of flows) {
                flow.progress += flow.speed;
                if(flow.progress > 1) flow.progress = 0;
                const point = flow.curve.getPoint(flow.progress);
                flow.particle.position.copy(point);
            }

            // Render
            composer.render();
        }

        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
