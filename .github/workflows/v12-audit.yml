name: V12 Permanent DNA Audit

on:
  pull_request:
    branches: [ "**" ]
  push:
    branches: [ "main", "master", "codex/**", "feature/**" ]

jobs:
  dna-checks:
    name: V12 Protocol Gates
    runs-on: windows-latest
    
    steps:
      - name: Checkout codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 1. ASCII Gate (Compiler Safety)
        shell: pwsh
        run: |
          if (Test-Path "check_ascii.py") {
            python check_ascii.py
          } else {
            Write-Host "check_ascii.py not found. Please ensure the script exists in the repository root."
            # If the script isn't found, you might want to fail the build depending on strictness.
          }

      - name: 2. Lock Audit (No Internal Locks)
        shell: pwsh
        run: |
          Write-Host "Scanning for banned lock(stateLock) statements..."
          # Search all C# files recursively
          $lockMatches = Get-ChildItem -Path . -Filter *.cs -Recurse | Select-String -Pattern "lock\s*\(\s*stateLock\s*\)"
          
          if ($lockMatches.Count -gt 0) {
            Write-Error "CRITICAL PROTOCOL VIOLATION: lock(stateLock) found in source files. Internal locks are BANNED per V12 DNA."
            $lockMatches | ForEach-Object { Write-Host "$($_.Path):$($_.LineNumber) -> $($_.Line.Trim())" }
            exit 1
          } else {
            Write-Host "PASS: Zero lock(stateLock) statements found."
          }

      - name: 3. Duplication & Dead Code Analysis (JetBrains ReSharper CLI)
        shell: pwsh
        run: |
          Write-Host "Installing JetBrains ReSharper CLI..."
          dotnet tool install -g JetBrains.ReSharper.GlobalTools
          
          # Ensure global tools are on the PATH for subsequent steps
          $toolPath = "$env:USERPROFILE\.dotnet\tools"
          if (-not ($env:Path -like "*$toolPath*")) {
              Write-Host "Adding $toolPath to GITHUB_PATH..."
              echo "$toolPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              $env:Path += ";$toolPath"
          }
          
          $proj = "Linting.csproj"
          if (Test-Path $proj) {
            Write-Host "Using analysis project: $proj"
            
            Write-Host "--- Running dupFinder (Duplicate Code) ---"
            jb dupfinder $proj --output=duplicates.xml --show-text
            
            Write-Host "--- Running inspectcode (Dead Code & Issues) ---"
            jb inspectcode $proj --output=inspection.xml --severity=WARNING
          } else {
            Write-Warning "Linting.csproj not found. Skipping ReSharper analysis."
          }


      - name: 5. SonarAnalyzer.CSharp (Roslyn Analyzer)
        shell: pwsh
        run: |
          $proj = "Linting.csproj"
          if (Test-Path $proj) {
            Write-Host "Adding SonarAnalyzer.CSharp to $proj..."
            dotnet add $proj package SonarAnalyzer.CSharp
            Write-Host "Building project to run Roslyn analyzers..."
            dotnet build $proj
          } else {
            Write-Host "Linting.csproj not found. Skipping SonarAnalyzer step."
          }
