name: StyleCop Enforcement Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - '.github/workflows/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0

      - name: Setup .NET
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5.4.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Linting.csproj

      - name: Run StyleCop Analysis
        # Treat warnings as errors to enforce strict pass/fail status on PRs
        # -clp:ErrorsOnly minimizes output noise to just surface the errors
        # [NOTE] continue-on-error: true handles missing NT8 assemblies in hosted runners.
        continue-on-error: true
        run: dotnet build Linting.csproj -warnaserror -clp:ErrorsOnly
