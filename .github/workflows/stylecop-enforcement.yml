name: StyleCop Enforcement Pipeline

on:
  push:
    branches: ["main"]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - '.github/workflows/**'
  pull_request:
    branches: ["main"]
    paths:
      - 'src/**/*.cs'
      - 'tests/**/*.cs'
      - '.github/workflows/**'

jobs:
  lint:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68  # v6.0.0
        with:
          dotnet-version: "8.0.x"

      - name: Restore dependencies
        run: dotnet restore Linting.csproj

      - name: Run StyleCop Analysis
        # Treat warnings as errors to enforce strict pass/fail status on PRs
        # -clp:ErrorsOnly minimizes output noise to just surface the errors
        # [NOTE] continue-on-error: true handles missing NT8 assemblies in hosted runners.
        continue-on-error: true
        run: dotnet build Linting.csproj -warnaserror -clp:ErrorsOnly
