name: Gemini Standards Auditor (Google AI Studio)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gemini-audit:
    name: Gemini 1.5 Pro (Standards Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Extract PR diff
        id: diff
        run: |
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Google AI SDK
        run: npm install @google/generative-ai

      - name: Run Gemini Standards Audit
        id: gemini_audit
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          cat << 'EOF' > gemini_audit.js
          const fs = require('fs');
          const { GoogleGenerativeAI } = require('@google/generative-ai');

          async function run() {
            try {
              if (!process.env.GEMINI_API_KEY) {
                throw new Error("GEMINI_API_KEY secret is missing. Please add it to GitHub Repository Secrets.");
              }

              const genAI = new GoogleGenerativeAI(process.env.GEMINI_API_KEY);
              // Primary: gemini-3.1-pro-preview, Backup: gemini-3.0-pro-preview
              const modelsToTry = ["gemini-3.1-pro-preview", "gemini-3.0-pro-preview"];
              let model;

              for (const modelId of modelsToTry) {
                try {
                  model = genAI.getGenerativeModel({ model: modelId });
                  console.log(`Selected model: ${modelId}`);
                  break;
                } catch (e) {
                  console.log(`${modelId} not found or unavailable, trying next...`);
                }
              }

              if (!model) {
                console.log("No Gemini 3.x models found, falling back to gemini-1.5-pro for safety.");
                model = genAI.getGenerativeModel({ model: "gemini-1.5-pro" });
              }

              let diffContent = fs.readFileSync('pr.diff', 'utf8');
              let geminiMdContent = '';
              try {
                geminiMdContent = fs.readFileSync('GEMINI.md', 'utf8');
              } catch (e) {
                console.log('GEMINI.md not found, proceeding without it.');
              }

              // SECURITY: Truncate oversized diffs
              const MAX_DIFF_CHARS = 100000;
              if (diffContent.length > MAX_DIFF_CHARS) {
                diffContent = diffContent.substring(0, MAX_DIFF_CHARS) + '\n... [TRUNCATED at 100KB]';
              }

              const prompt = 'You are the Gemini Standards Auditor (Antigravity Auto-Auditor) performing an automated compliance check.\n'
                + 'Your task is to analyze the following PR diff strictly against our project\'s institutional standards.\n\n'
                + 'GEMINI.md Standards:\n'
                + geminiMdContent + '\n\n'
                + 'PR DIFF:\n'
                + diffContent + '\n\n'
                + 'Systematic Audit Protocol:\n'
                + '1. Verify Zero-Trust IPC compliance.\n'
                + '2. Check for FSM Follower Replace pattern violations.\n'
                + '3. Enforce ASCII-ONLY string literals in all C# source code.\n'
                + '4. Verify StateLock usage for activePositions and expectedPositions.\n'
                + '5. Check for Metabolic Elegance and naming conventions.\n\n'
                + 'Provide:\n'
                + '- A list of specific violations (file and line if possible).\n'
                + '- Final Audit Verdict: PASS or FAIL.\n\n'
                + 'Be uncompromising. Safety first.';

              const result = await model.generateContent(prompt);
              const response = await result.response;
              const text = response.text();

              fs.writeFileSync('review.txt', text);
            } catch (error) {
              console.error('Critical Failure:', error);
              fs.writeFileSync(
                'review.txt',
                "Warning: **Gemini Auditor Critical Failure**: " + error.message +
                  "\n\n**Recommendation**: Ensure 'GEMINI_API_KEY' is set in GitHub Secrets and is a valid Google AI Studio API key."
              );
              process.exit(0);
            }
          }
          run();
          EOF
          node gemini_audit.js

      - name: Post Gemini Review Comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Antigravity Auto-Auditor (Gemini AI Studio)\n\n" + reviewText
            });

