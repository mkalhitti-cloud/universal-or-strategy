name: Gemini Standards Auditor (Vertex AI)

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  gemini-audit:
    name: Gemini 3.1 Pro (Standards Audit)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          fetch-depth: 0

      - name: Extract PR diff
        id: diff
        run: |
          git fetch origin ${{ github.event.pull_request.base.ref }} --depth=1
          git diff origin/${{ github.event.pull_request.base.ref }}...HEAD > pr.diff

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed  # v2
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4
        with:
          node-version: "20"

      - name: Install Vertex AI SDK
        run: npm install @google-cloud/vertexai

      - name: Run Gemini Standards Audit
        id: gemini_audit
        env:
          GCP_PROJECT_ID: "project-263b6139-6893-4788-995"
          GCP_REGION: "us-central1"
        run: |
          cat << 'EOF' > gemini_audit.js
          const fs = require('fs');
          const { VertexAI } = require('@google-cloud/vertexai');

          async function run() {
            try {
              let diffContent = fs.readFileSync('pr.diff', 'utf8');
              let geminiMdContent = '';
              try {
                geminiMdContent = fs.readFileSync('GEMINI.md', 'utf8');
              } catch (e) {
                console.log('GEMINI.md not found, proceeding without it.');
              }

              // SECURITY (Build 1105): Truncate oversized diffs to prevent prompt stuffing
              const MAX_DIFF_CHARS = 100000;
              if (diffContent.length > MAX_DIFF_CHARS) {
                diffContent = diffContent.substring(0, MAX_DIFF_CHARS) + '\n... [TRUNCATED at 100KB]';
              }

              // SECURITY (Build 1105): Use string concatenation with JSON.stringify to prevent
              // template literal injection from malicious PR diff content.
              const prompt = 'You are ADJUDICATOR-RED -- an adversarial forensic auditor for the V12 Photon Kernel CI pipeline.\n'
                + 'Your mission is to find every defect that could cause a live trading loss, data corruption, or protocol breach.\n\n'
                + 'V12 DNA Rules (Non-Negotiable):\n'
                + 'Rule 1 -- Lock-Free Actor Pattern: lock(), Monitor.Enter(), Mutex (as state guard) are BANNED in src/. All state mutations via FSM Enqueue().\n'
                + 'Rule 2 -- ASCII-Only: No Unicode, emoji, or curly quotes in C# string literals in modified files.\n'
                + 'Rule 3 -- Extractor Script Mandate: File splits >50 lines MUST use scripts/v12_split.py. Manual copy-paste is BANNED.\n'
                + 'Rule 4 -- FSM Replace Pattern: Follower order cancel+resubmit MUST use two-phase Replace FSM (_followerReplaceSpecs dict). Direct Cancel()->Submit() is BANNED -- creates ghost orders.\n'
                + 'Rule 5 -- AMAL Gate: PRs with high-performance C# extraction (SPSC/MPMC/Atomic) must include Allocated=0B AND Gen0=0 benchmark proof.\n'
                + 'Rule 6 -- Zero-Trust IPC: Loopback binding only. All incoming data validated against allowlist before processing.\n\n'
                + 'GEMINI.md Project Standards:\n'
                + JSON.stringify(geminiMdContent) + '\n\n'
                + 'PR DIFF:\n'
                + JSON.stringify(diffContent) + '\n\n'
                + '4-POINT FORENSIC AUDIT -- run ALL four parameters, never skip:\n\n'
                + '[P1] LOGIC DRIFT: Did the changes alter any original execution behavior, FSM branching, state transitions, or observable side-effects?\n'
                + 'Flag: changed branch conditions, reordered operations, removed null guards, altered default values, changed method call order in hot paths.\n\n'
                + '[P2] LOCK-FREE SAFETY SCAN: Scan ALL added lines (prefixed + in the diff) in src/ for: lock(, Monitor.Enter, Monitor.TryEnter, Mutex.WaitOne.\n'
                + 'Any match in src/ = BLOCKER. Report every occurrence with file:line and quote the flagged line.\n\n'
                + '[P3] PROTOCOL GATE COMPLIANCE:\n'
                + '  (a) AMAL Gate: Is there a passing amal_harness.py benchmark result in the PR? Look for Allocated = 0 B and Gen0 = 0.\n'
                + '  (b) DNA Rule 3: Does the diff show v12_split.py was used for any split >50 lines?\n'
                + '  (c) Repo Hygiene: Are any .bak, .log, .threads.json, or agent session state files committed?\n\n'
                + '[P4] UNRESTRICTED BUG BOUNTY: Find what the checklist missed. Hunt for:\n'
                + '  - TOCTOU race conditions (read-check-act patterns on shared mutable state)\n'
                + '  - Counter asymmetry (Interlocked.Increment without matching Decrement on ALL exit paths including fallback and exception paths)\n'
                + '  - Silent exception swallows (empty catch {}, or catch with no logging)\n'
                + '  - Ghost order risk (Cancel() without FSM state guard before next Submit())\n'
                + '  - Time source drift (DateTime.Now mixed with DateTime.UtcNow in same logical operation)\n'
                + '  - Diagnostic regressions (Print() statements present in base branch but removed in this diff)\n'
                + '  - Disposal gaps (IDisposable allocated without using() or explicit Dispose() call)\n'
                + '  - Snapshot staleness (stale position/order snapshots used after callback-driven mutations)\n'
                + '  - Supply chain violations (binary files, .bak, .log, agent JSON committed to repo)\n'
                + '  - Anything else a hostile senior engineer would escalate in a production code review\n\n'
                + 'CITATION RULE: For every finding, cite the exact file and line number. Findings without a code citation are DISQUALIFIED.\n'
                + 'CLASSIFICATION: Label each finding [BLOCKER] (must fix before merge) | [ADVISORY] (informational) | [BOUNTY] (discovered beyond checklist).\n\n'
                + 'Provide:\n'
                + '- Detailed findings per parameter with file:line citations and quoted evidence.\n'
                + '- BOUNTY discoveries with severity tier: CRITICAL(P0) | HIGH(P1) | MEDIUM(P2) | LOW(P3).\n'
                + '- Final Audit Verdict: APPROVED | CONDITIONAL (list advisories) | BLOCKED (list blockers).\n'
                + 'Be relentless and uncompromising. Show your work.';

              const project = process.env.GCP_PROJECT_ID;
              const regions = ['global', 'us-central1', 'us-east4', 'us-west1', 'europe-west1', 'us-east1'];
              const modelsToTry = [
                'gemini-3.1-pro-preview',
                'gemini-1.5-pro-002',
                'gemini-1.5-flash-002',
                'gemini-1.5-pro',
                'gemini-1.5-flash'
              ];

              let generativeModel;
              let workingRegion = '';
              let workingModel = '';

              console.log(`Starting Vertex AI Probe for project: ${project}`);

              outerLoop:
              for (const loc of regions) {
                console.log(`Probing region: ${loc}`);
                const vertex_ai = new VertexAI({ project, location: loc });

                for (const modelName of modelsToTry) {
                  try {
                    console.log(`  Trying ${modelName}...`);
                    const testModel = vertex_ai.getGenerativeModel({ model: modelName });
                    await testModel.generateContent({
                      contents: [{ role: 'user', parts: [{ text: 'ping' }] }],
                    });
                    console.log(`  SUCCESS: ${modelName} works in ${loc}`);
                    generativeModel = testModel;
                    workingRegion = loc;
                    workingModel = modelName;
                    break outerLoop;
                  } catch (e) {
                    console.log(`  FAILED: ${modelName} in ${loc}: ${e.message}`);
                  }
                }
              }

              if (!generativeModel) {
                throw new Error(`Failed to find any working Gemini model across regions: ${regions.join(', ')}. Please verify Vertex AI API and Billing are active.`);
              }

              console.log(`Proceeding with audit using ${workingModel} in ${workingRegion}`);
              const resp = await generativeModel.generateContent({
                contents: [{ role: 'user', parts: [{ text: prompt }] }],
              });

              const reviewText = `**Forensic Audit Result (${workingModel} @ ${workingRegion})**\n\n` + resp.response.candidates[0].content.parts[0].text;
              fs.writeFileSync('review.txt', reviewText);
            } catch (error) {
              console.error('Critical Failure:', error);
              fs.writeFileSync(
                'review.txt',
                "Warning: **Gemini Auditor Critical Failure**: " + error.message +
                  "\n\n**Recommendation**: Check GCP Console for Project 'project-263b6139-6893-4788-995'. Ensure 'Vertex AI API' is enabled and models are accessible in your region."
              );
              process.exit(0);
            }
          }
          run();
          EOF
          node gemini_audit.js

      - name: Post Gemini Review Comment
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b  # v7
        with:
          script: |
            const fs = require('fs');
            const reviewText = fs.readFileSync('review.txt', 'utf8');
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: "### Antigravity Auto-Auditor (Gemini via Vertex AI)\n\n" + reviewText
            });
