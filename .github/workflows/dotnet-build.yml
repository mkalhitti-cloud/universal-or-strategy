# [BUILD 948] .NET Desktop Build & Compile Check
# Validates that all NinjaScript C# files compile cleanly on Windows.
# A GREEN checkmark here means the code is safe to paste into NinjaTrader 8 (F5 should pass).
# A RED X means Antigravity introduced a compile error that must be fixed before merging.

name: ".NET Desktop Build"

on:
  push:
    branches: ["main", "build/**", "codex/**", "feature/**"]
    paths:
      - "src/**.cs"
  pull_request:
    branches: ["main", "codex/**", "feature/**"]
    paths:
      - "src/**.cs"

jobs:
  build:
    name: Compile NinjaScript (C# / .NET 4.8)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9  # v4
        with:
          dotnet-version: "8.0.x"

      - name: 1. ASCII Gate (Compiler Safety)
        shell: pwsh
        run: |
          if (Test-Path "check_ascii.py") {
            python check_ascii.py
          } else {
            Write-Host "check_ascii.py not found. Please ensure the script exists in the repository root."
          }

      - name: Restore dependencies (if .csproj present)
        run: |
          if (Test-Path "*.csproj") {
            dotnet restore universal-or-strategy.sln --nologo
          } else {
            Write-Host "No .csproj found -- skipping restore (NinjaScript partial-class project)."
          }
        shell: pwsh

      - name: Build Solution (Compilation Check)
        run: dotnet build universal-or-strategy.sln --configuration Release --nologo
        shell: pwsh

      - name: Check for non-ASCII characters (ASCII Gate)
        # [MANIFESTO] Section 7: Non-ASCII in C# string literals breaks NT8 with 300+ errors.
        run: |
          python check_ascii.py
        shell: pwsh

      - name: Report build status
        if: always()
        run: |
          Write-Host "Build pipeline complete. Check above steps for any compile or ASCII gate failures."
        shell: pwsh
